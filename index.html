<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ROOTFALL</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; }
      body { touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      #game { width: 100%; height: 100%; }
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #111; color: #fff;
        align-items: center; justify-content: center; text-align: center; font: 24px sans-serif; padding: 24px; }
      @media (orientation: portrait) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">スマートフォンを横にしてください</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
